rule_id: NW-AWS-RDS-003
title: "RDS Automatic Minor Version Upgrade Disabled"
description: "Minor engine versions carry security patches. With automatic minor upgrades off, known database engine vulnerabilities remain until someone patches manually."
service: RDS
severity_vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
cis_control_v7: "3.2.2 Ensure the Auto Minor Version Upgrade feature is enabled for RDS instances (CIS AWS v7.1.0 · FSBP RDS.13)"
remediation_cli: "aws rds modify-db-instance --db-instance-identifier <instance_id> --auto-minor-version-upgrade --apply-immediately"
detection_logic:
  check_type: rds_attribute
  resource_type: rds_instance
