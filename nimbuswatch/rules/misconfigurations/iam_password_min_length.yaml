rule_id: NW-AWS-IAM-004
title: "IAM Password Policy Minimum Length Below 14"
description: "Short console passwords are vulnerable to brute-force and credential-stuffing attacks. CIS requires an account password policy with a minimum length of 14 characters."
service: IAM
severity_vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
cis_control_v7: "2.8 Ensure IAM password policy requires minimum length of 14 or greater (CIS AWS v7.1.0 · FSBP IAM.15)"
remediation_cli: "aws iam update-account-password-policy --minimum-password-length 14"
detection_logic:
  check_type: password_policy
  resource_type: iam_account
