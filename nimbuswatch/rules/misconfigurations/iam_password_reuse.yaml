rule_id: NW-AWS-IAM-005
title: "IAM Password Policy Allows Password Reuse"
description: "Without reuse prevention, users can cycle back to previously compromised passwords. CIS requires the policy to remember the last 24 passwords."
service: IAM
severity_vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:N/A:N"
cis_control_v7: "2.9 Ensure IAM password policy prevents password reuse (CIS AWS v7.1.0 · FSBP IAM.16)"
remediation_cli: "aws iam update-account-password-policy --password-reuse-prevention 24"
detection_logic:
  check_type: password_policy
  resource_type: iam_account
