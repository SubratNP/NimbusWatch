rule_id: NW-AWS-IAM-007
title: "IAM Access Key Older Than 90 Days"
description: "Long-lived access keys accumulate exposure in code, CI logs and laptops. Keys should be rotated at least every 90 days to bound the usefulness of a leaked credential."
service: IAM
severity_vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
cis_control_v7: "2.12 Ensure access keys are rotated every 90 days or less (CIS AWS v7.1.0 · FSBP IAM.3)"
remediation_cli: "aws iam create-access-key --user-name <user_name> && aws iam update-access-key --user-name <user_name> --access-key-id <access_key_id> --status Inactive"
detection_logic:
  check_type: iam_access_key_age
  resource_type: iam_access_key
