rule_id: NW-AWS-S3-004
title: "S3 Account-Level Block Public Access Disabled"
description: "The account-level Block Public Access setting is a guardrail that overrides any bucket ACL or policy that would make data public, including buckets created in the future."
service: S3
severity_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
cis_control_v7: "3.1.4 Ensure that S3 is configured with 'Block Public Access' enabled — account level (CIS AWS v7.1.0 · FSBP S3.1)"
remediation_cli: "aws s3control put-public-access-block --account-id <account_id> --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
detection_logic:
  check_type: s3_account_public_access_block
  resource_type: aws_account
