rule_id: NW-AWS-RDS-004
title: "RDS Instance Not Deployed Across Multiple AZs"
description: "Single-AZ databases go offline during an Availability Zone outage or maintenance failover, affecting availability of dependent services."
service: RDS
severity_vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:L"
cis_control_v7: "3.2.4 Ensure Multi-AZ deployments are used for enhanced availability in Amazon RDS (CIS AWS v7.1.0 · FSBP RDS.5)"
remediation_cli: "aws rds modify-db-instance --db-instance-identifier <instance_id> --multi-az --apply-immediately"
detection_logic:
  check_type: rds_attribute
  resource_type: rds_instance
